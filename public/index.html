<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BYZID APPARELS PVT LTD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F17;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(79, 140, 255, 0.4);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 8px 0;
      color: #ffffff;
      text-align: center;
    }
    p {
      font-size: 11px;
      color: #9BA7B4;
      margin: 0 0 32px 0;
      letter-spacing: 1.5px;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(79, 140, 255, 0.2);
      border-top-color: #4F8CFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="BYZID APPARELS" class="logo" />
  <h1>BYZID APPARELS PVT LTD</h1>
  <p>FACTORY OPERATIONAL TELEMETRY</p>
  <div class="spinner"></div>
</body>
</html>
